<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>Alta producto</title>
</head>
<body>
<h1>Alta de producto</h1>
<form action="alta-producto" method="post">
    <label>Nombre: <input name="nombre" type="text" required></label>
    <label>Precio: <input name="precio" type="number" step="0.01" min="0.01" required></label>
    <select name="categoria">
        <option value="informatica">Informática</option>
        <option value="libros">Libros</option>
        <option value="hogar">Hogar</option>
    </select>
    <label><input name="disponible" type="checkbox" value="si"> Disponible</label>
    <button type="submit">Dar de alta</button>
</form>
<a href="inicio">Volver</a>
</body>
</html>
